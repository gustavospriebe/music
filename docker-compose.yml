services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: resenha
      POSTGRES_PASSWORD: resenha
      POSTGRES_DB: resenha
    ports: ['${POSTGRES_PORT:-5433}:5432']
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U resenha -d resenha']
      interval: 5s
      timeout: 3s
      retries: 20
    volumes: [postgres-data:/var/lib/postgresql/data]
  mailpit:
    image: axllent/mailpit:v1.22
    profiles: ['mail']
    ports: ['${MAILPIT_SMTP_PORT:-1025}:1025', '${MAILPIT_WEB_PORT:-8025}:8025']
volumes:
  postgres-data:
