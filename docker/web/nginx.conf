server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA URLs can contain private delivery capabilities. Never log request URIs.
  access_log off;
  error_log /dev/stderr crit;
  add_header Referrer-Policy "no-referrer" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header X-Frame-Options "DENY" always;

  # Resolve the internal service again after its address changes during deployment.
  resolver ${NGINX_LOCAL_RESOLVERS} valid=10s;
  set $api_upstream "${API_UPSTREAM}";
  location /api/ {
    client_max_body_size 9m;
    proxy_pass $api_upstream;
    proxy_ssl_server_name on;
    proxy_ssl_verify on;
    proxy_ssl_trusted_certificate /etc/ssl/cert.pem;
    proxy_http_version 1.1;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_read_timeout 90s;
    proxy_buffering off;
  }

  location / { try_files $uri $uri/ /index.html; }
}
