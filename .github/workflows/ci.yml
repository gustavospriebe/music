name: CI

on: [push, pull_request]

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18-alpine
        env:
          POSTGRES_USER: resenha
          POSTGRES_PASSWORD: resenha
          POSTGRES_DB: resenha
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U resenha -d resenha"
          --health-interval 5s --health-timeout 5s --health-retries 20
    env:
      DATABASE_URL: postgresql://resenha:resenha@localhost:5432/resenha
      DATABASE_URL_TEST: postgresql://resenha:resenha@localhost:5432/resenha_test
      NODE_ENV: test
      COOKIE_SECRET: ci-cookie-secret-at-least-32-characters
      CUSTOMER_ACCESS_TOKEN_PEPPER: ci-customer-token-pepper-at-least-32
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: sudo apt-get update && sudo apt-get install -y ffmpeg
      - run: psql "$DATABASE_URL" -c 'create database resenha_test'
      - run: pnpm db:migrate
      - run: DATABASE_URL="$DATABASE_URL_TEST" pnpm db:migrate
      - run: pnpm format:check
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm exec turbo run test --concurrency=1
      - run: pnpm test:ops
      - run: pnpm build
      - run: docker build -f docker/web/Dockerfile -t music-web:ci .
      - run: node scripts/test-web-proxy.mjs music-web:ci
      - run: pnpm --filter @resenha/web exec playwright install --with-deps chromium
      - run: pnpm test:e2e
